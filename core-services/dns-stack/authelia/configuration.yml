theme: dark
jwt_secret: "insecure_jwt_secret_for_homelab"
default_redirection_url: https://kuma.loki.lab

server:
  host: 0.0.0.0
  port: 9091

log:
  level: info

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: deny
  rules:
    # Bypass API routes so Uptime Kuma can monitor itself without logging in
    - domain: 
        - "kuma.loki.lab"
        - "pihole.loki.lab"
      policy: bypass
      resources:
        - "^/api.*"
    # Require 1FA (Username/Password) for all other routes
    - domain: "*.loki.lab"
      policy: one_factor

session:
  name: authelia_session
  secret: "insecure_session_secret_for_homelab"
  expiration: 3600
  inactivity: 300
  domain: loki.lab

storage:
  encryption_key: "an_insecure_but_sufficiently_long_key_for_homelab"
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
